name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read the pinned SpruceOS commit
        id: pin
        run: echo "commit=$(grep -E '^pyui-tested-commit' pyproject.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      # PyUI and the default theme, for the bridge, the desktop shim and headless screen tests.
      - name: Check out PyUI at the pinned commit
        uses: actions/checkout@v5
        with:
          repository: spruceUI/spruceOS
          ref: ${{ steps.pin.outputs.commit }}
          path: .spruceos
          sparse-checkout: |
            App/PyUI
            Themes/SPRUCE

      # setup-uv has no major tags since v8, so pin the release. Keep uv on the minor that
      # pyproject's uv_build bound allows, so CI builds the way contributors do.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.10.x"

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: make lint

      - name: Type check
        run: make typecheck

      - name: Test
        run: mkdir -p build && make test  # pytest won't create a --basetemp's parent
        env:
          PYTEST_ADDOPTS: --basetemp=build/pytest  # keep the screen tests' captures

      # The screens a failing screen test rendered, to see what went wrong.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screen-test-captures
          path: |
            build/pytest/**/shots/**/*.png
          if-no-files-found: ignore

  # A tag like v0.1.0 or v0.1.0b1 publishes a GitHub release with the device zip, once the
  # checks pass. Versions with a/b/rc/dev in them become pre-releases.
  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.10.x"

      - name: Package
        run: make package

      - name: Build linked release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/release_notes.py "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" dist/release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -E '^version' pyproject.toml | cut -d'"' -f2)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in pyproject.toml"
            exit 1
          fi
          case "$version" in *a* | *b* | *rc* | *dev*) prerelease=1 ;; esac
          gh release create "$GITHUB_REF_NAME" "dist/Cheevos-$version.zip" \
            --verify-tag --title "v$version" ${prerelease:+--prerelease} \
            --notes-file dist/release-notes.md
