name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read the pinned SpruceOS commits
        id: pin
        run: |
          echo "commit=$(grep -E '^pyui-tested-commit' pyproject.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
          echo "proxy=$(grep -E '^proxy-tested-commit' pyproject.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      # PyUI and the default theme, for the bridge, the desktop runner and headless screen tests.
      - name: Check out PyUI at the pinned commit
        uses: actions/checkout@v5
        with:
          repository: spruceUI/spruceOS
          ref: ${{ steps.pin.outputs.commit }}
          path: .spruceos
          sparse-checkout: |
            App/PyUI
            Themes/SPRUCE

      # The RAOfflineProxy bundle ROM identification was verified against, fetched before the
      # tests so they stay deterministic (scripts/check_proxy_compat.py and its tests).
      - name: Check out RAOfflineProxy at the pinned commit
        uses: actions/checkout@v5
        with:
          repository: spruceUI/spruceOS
          ref: ${{ steps.pin.outputs.proxy }}
          path: .spruceos-proxy
          sparse-checkout: App/RAOfflineProxy

      # setup-uv has no major tags since v8, so pin the release. Keep uv on the minor that
      # pyproject's uv_build bound allows, so CI builds the way contributors do.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.10.x"

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: make lint

      - name: RAOfflineProxy compatibility
        run: |
          mkdir -p build
          make proxy-check > build/proxy-compat.txt 2>&1 || status=$?
          cat build/proxy-compat.txt
          { echo '```'; cat build/proxy-compat.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "${status:-0}"

      - name: Type check
        run: make typecheck

      - name: Test
        run: mkdir -p build && make test  # pytest won't create a --basetemp's parent
        env:
          PYTEST_ADDOPTS: --basetemp=build/pytest  # keep the screen tests' captures

      # The screens a failing screen test rendered, to see what went wrong.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screen-test-captures
          path: |
            build/pytest/**/shots/**/*.png
          if-no-files-found: ignore

  # A tag like v0.1.0 or v0.1.0b1 publishes a GitHub release with the device zip, once the
  # checks pass. Versions with a/b/rc/dev in them become pre-releases.
  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      stable: ${{ steps.publish.outputs.stable }}
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.10.x"

      - name: Package
        run: make package

      - name: Build linked release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/release_notes.py "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" dist/release-notes.md

      - name: Publish the release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -E '^version' pyproject.toml | cut -d'"' -f2)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in pyproject.toml"
            exit 1
          fi
          case "$version" in *a* | *b* | *rc* | *dev*) prerelease=1 ;; esac
          gh release create "$GITHUB_REF_NAME" "dist/Cheevos-$version.zip" \
            --verify-tag --title "v$version" ${prerelease:+--prerelease} \
            --notes-file dist/release-notes.md
          if [ -z "${prerelease:-}" ]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi

  # Mirror the released guide, after a successful stable release. Using a dependent job
  # lets a failed wiki sync be retried without publishing the release again.
  wiki:
    needs: release
    if: needs.release.outputs.stable == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: wiki-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Build wiki
        run: python3 scripts/build_wiki.py

      # Create the first wiki page on GitHub once, so this repository exists.
      # checkout resolves its default branch and persists GITHUB_TOKEN for the push.
      - name: Check out wiki
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository }}.wiki
          path: build/wiki-checkout

      - name: Publish wiki
        working-directory: build/wiki-checkout
        run: |
          rsync --archive --delete --exclude=.git ../wiki/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Wiki already matches $GITHUB_REF_NAME"
          else
            git commit -m "Docs: sync wiki for $GITHUB_REF_NAME"
            git push
          fi

  # Propose the exact public-release package in SpruceOS after all preceding jobs pass.
  # This job can be retried separately; a fixed branch per tag reuses its existing PR.
  spruceos:
    needs: [release, wiki]
    if: github.event_name == 'push' && needs.release.outputs.stable == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: spruceos-release-pr
      cancel-in-progress: false
    env:
      SPRUCEOS_FORK: ${{ vars.SPRUCEOS_FORK || 'abalakh/spruceOS' }}
      SPRUCEOS_BASE_BRANCH: ${{ vars.SPRUCEOS_BASE_BRANCH || 'Development' }}
    steps:
      - name: Check upstream PR configuration
        env:
          GH_TOKEN: ${{ secrets.SPRUCEOS_PR_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set the SPRUCEOS_PR_TOKEN Actions secret (see RELEASING.md)."
            exit 1
          fi
          source=$(gh api "repos/$SPRUCEOS_FORK" --jq '.source.full_name')
          if [ "$source" != "spruceUI/spruceOS" ]; then
            echo "::error::SPRUCEOS_FORK must name a fork of spruceUI/spruceOS."
            exit 1
          fi

      - name: Download the published device package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="Cheevos-${GITHUB_REF_NAME#v}.zip"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern "$archive" --dir build/spruce-release
          unzip -q "build/spruce-release/$archive" -d build/spruce-release

      - name: Check out the SpruceOS target branch
        uses: actions/checkout@v5
        with:
          repository: spruceUI/spruceOS
          ref: ${{ env.SPRUCEOS_BASE_BRANCH }}
          token: ${{ secrets.SPRUCEOS_PR_TOKEN }}
          path: build/spruceos
          sparse-checkout: |
            App/Cheevos
            Licenses/Cheevos

      - name: Mirror the released app
        run: |
          mkdir -p build/spruceos/App/Cheevos build/spruceos/Licenses/Cheevos
          rsync --archive --delete --exclude /LICENSE \
            build/spruce-release/Cheevos/ build/spruceos/App/Cheevos/
          cp build/spruce-release/Cheevos/LICENSE build/spruceos/Licenses/Cheevos/LICENSE.Cheevos.txt
          chmod 755 build/spruceos/App/Cheevos/launch.sh build/spruceos/App/Cheevos/identify-rom.sh

      - name: Build the SpruceOS pull request description
        env:
          GH_TOKEN: ${{ github.token }}
          PR_INTRO: |
            Mirror Cheevos [${{ github.ref_name }}](https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}) into `App/Cheevos/` for inclusion in SpruceOS.
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json body --jq '.body' > build/spruce-release/notes.md
          if ! grep -q '^## Changes$' build/spruce-release/notes.md; then
            echo "::error::Published release notes have no Changes section."
            exit 1
          fi
          printf '%s\n' "$PR_INTRO" > build/spruce-pr-body.md
          sed -n '/^## Changes$/,$p' build/spruce-release/notes.md >> build/spruce-pr-body.md

      - name: Prepare the SpruceOS pull request
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.SPRUCEOS_PR_TOKEN }}
          path: build/spruceos
          push-to-fork: ${{ env.SPRUCEOS_FORK }}
          base: ${{ env.SPRUCEOS_BASE_BRANCH }}
          branch: cheevos/${{ github.ref_name }}
          add-paths: |
            App/Cheevos/
            Licenses/Cheevos/
          commit-message: "App: Update Cheevos to ${{ github.ref_name }}"
          title: "App: Update Cheevos to ${{ github.ref_name }}"
          body-path: build/spruce-pr-body.md

      - name: Link the upstream pull request
        env:
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          if [ -n "$PR_URL" ]; then
            echo "SpruceOS PR: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "SpruceOS App/Cheevos already matches $GITHUB_REF_NAME." >> "$GITHUB_STEP_SUMMARY"
          fi
